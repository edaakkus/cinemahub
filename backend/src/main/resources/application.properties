spring.application.name=cinema-hub

# ==========================
# MySQL Configuration
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/cinemahub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Edaakkus.05
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate sürümü artık dialect'i otomatik seçiyor.
# Bu satıra artık gerek yok.
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# Logging
# ==========================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.eda.cinemahub=DEBUG

# ==========================
# Disable Open Session In View
# ==========================
spring.jpa.open-in-view=false

# HS256 icin en az 32 karakter (256 bit) olmali. Bu ornek degeri gercek projede degistir.
jwt.secret=cinemaHubSuperSecretKeyForJwtSigning123456789
jwt.expiration-ms=86400000